<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Scraper</title>
    <style>
        /* General styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            color: #4CAF50;
        }

        h2 {
            color: #333;
        }

        /* Form container */
        #reviewForm {
            background-color: white;
            padding: 20px;
            max-width: 600px;
            margin: 30px auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
            margin-bottom: 10px;
            display: inline-block;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Reviews output area */
        #reviewsOutput {
            background-color: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            color: #555;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            #reviewForm {
                width: 90%;
                padding: 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Product Review Scraper</h1>
    <form id="reviewForm">
        <label for="url">Enter Product URL:</label>
        <input type="text" id="url" name="url" placeholder="https://example.com" required>
        <button type="submit">Fetch Reviews</button>
    </form>
    <h2>Reviews:</h2>
    <pre id="reviewsOutput"></pre>

    <script>
        const form = document.getElementById('reviewForm');
        const reviewsOutput = document.getElementById('reviewsOutput');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('url').value;

            try {
                const response = await fetch(`http://127.0.0.1:5000/reviews?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                reviewsOutput.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                reviewsOutput.textContent = 'Error fetching reviews.';
            }
        });
    </script>
</body>
</html>
